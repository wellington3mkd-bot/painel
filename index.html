<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comando - O Caminho</title>
    <style>
        :root {
            --bg-deep: #0d0e12;
            --panel-glass: rgba(13, 14, 18, 0.95);
            --gold-glow: linear-gradient(135deg, #dfb76c, #c29947);
            --gold-pure: #dfb76c;
            --cyan-glow: #00f0ff;
            --text-light: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03), transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(13, 14, 18, 0.98);
            border-bottom: 1px solid rgba(223, 183, 108, 0.2);
        }

        .brand-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px dashed var(--gold-pure);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(223, 183, 108, 0.2);
        }

        .brand-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        header h1 {
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--gold-pure), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 380px 1fr;
            gap: 15px;
            padding: 15px;
            flex: 1;
            width: 100%;
            max-width: 100%;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .module-block {
            background: var(--panel-glass);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(223, 183, 108, 0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .module-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--gold-pure);
            border-bottom: 1px solid rgba(223, 183, 108, 0.15);
            padding-bottom: 4px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            flex: 1;
        }

        .hud-btn {
            background: rgba(18, 20, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .hud-btn:hover {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            background: rgba(0, 240, 255, 0.02);
            transform: translateY(-1px);
        }

        .btn-title {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .center-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px;
            border: 1px solid rgba(0, 240, 255, 0.05);
        }

        .hologram-stage {
            width: 100%;
            height: 340px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .balanca-projection {
            width: 200px;
            height: 200px;
            position: relative;
            animation: float 4s infinite ease-in-out;
        }

        .balanca-projection img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .balanca-vector {
            width: 100%;
            height: 100%;
            stroke: var(--cyan-glow);
            stroke-width: 1.5;
            fill: none;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        .projector-base {
            position: absolute;
            bottom: 40px;
            width: 180px;
            height: 35px;
            overflow: hidden;
        }

        .projector-base img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .base-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #14161f, #222736);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 50% / 10px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .projector-beam {
            position: absolute;
            bottom: 60px;
            width: 160px;
            height: 220px;
            background: linear-gradient(to top, rgba(0, 240, 255, 0.15), transparent);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            pointer-events: none;
        }

        footer {
            background: #0d0e12;
            border-top: 1px solid rgba(223, 183, 108, 0.2);
            padding: 10px 30px;
            display: flex;
            justify-content: center;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--gold-pure);
            color: var(--gold-pure);
            padding: 6px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .admin-btn:hover, .admin-btn.active {
            background: var(--gold-glow);
            color: #000;
            box-shadow: 0 0 10px rgba(223, 183, 108, 0.3);
        }

        #editor-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #13151b;
            border: 1px solid var(--gold-pure);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
        }

        .modal-content h3 {
            color: var(--gold-pure);
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: #fff;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--cyan-glow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr; }
            .center-column { grid-row: 1; height: 280px; }
            .hologram-stage { height: 220px; }
            header { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

        </div>
