<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Comando Digital - O Caminho</title>
    <style>
        :root {
            --bg-deep: #08090d;
            --panel-glass: rgba(13, 15, 22, 0.75);
            --gold-glow: linear-gradient(135deg, #dfb76c, #c29947);
            --gold-pure: #dfb76c;
            --left-neon: #00ff66;
            --right-neon: #dfb76c;
            --center-cyan: #00f0ff;
            --text-light: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05), transparent 70%),
                linear-gradient(rgba(18, 20, 28, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 20, 28, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE SEGURANÇA (LOCKSCREEN) */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 13, 0.98);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .scanner-line {
            width: 100%;
            height: 4px;
            background: var(--center-cyan);
            box-shadow: 0 0 20px var(--center-cyan);
            position: absolute;
            top: 0;
            animation: scan 4s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .login-box {
            background: var(--panel-glass);
            border: 1px solid rgba(223, 183, 108, 0.3);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .login-box h2 {
            color: var(--gold-pure);
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--center-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .login-box button {
            background: var(--gold-glow);
            border: none;
            padding: 12px 30px;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .login-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(223, 183, 108, 0.5);
        }

        /* HUD PRINCIPAL */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 15, 22, 0.9);
            border-bottom: 1px solid rgba(223, 183, 108, 0.2);
        }

        .brand-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px dashed var(--gold-pure);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(223, 183, 108, 0.2);
        }

        .brand-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .brand-placeholder {
            font-size: 0.7rem;
            color: var(--gold-pure);
            text-align: center;
            font-weight: bold;
        }

        header h1 {
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, var(--gold-pure), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(223, 183, 108, 0.3);
        }

        /* GRID DA OPERAÇÃO */
        main {
            display: grid;
            grid-template-columns: 1fr 420px 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .module-block {
            background: var(--panel-glass);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .left-column .module-block {
            border-left: 3px solid var(--left-neon);
        }

        .right-column .module-block {
            border-right: 3px solid var(--right-neon);
        }

        .module-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-column .module-title { color: var(--left-neon); }
        .right-column .module-title { color: var(--right-neon); }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* BOTÕES DO MENU HOLOGRÁFICO */
        .hud-btn {
            background: rgba(20, 24, 35, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px 10px;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .hud-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
            opacity: 0.5;
        }

        .left-column .hud-btn:hover {
            border-color: var(--left-neon);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.25);
            background: rgba(0, 255, 102, 0.05);
            transform: translateY(-2px);
        }

        .right-column .hud-btn:hover {
            border-color: var(--right-neon);
            box-shadow: 0 0 15px rgba(223, 183, 108, 0.25);
            background: rgba(223, 183, 108, 0.05);
            transform: translateY(-2px);
        }

        .btn-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .btn-tag {
            font-size: 0.65rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        .btn-icon-slot {
            position: absolute;
            right: 8px;
            bottom: 6px;
            width: 18px;
            height: 18px;
            opacity: 0.15;
            transition: opacity 0.3s;
        }

        .hud-btn:hover .btn-icon-slot {
            opacity: 0.7;
        }

        .hud-btn-empty {
            border: 1px dashed rgba(223, 183, 108, 0.25) !important;
            background: transparent !important;
        }

        /* NÚCLEO CENTRAL TÁTICO */
        .center-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-left: 1px solid rgba(0, 240, 255, 0.05);
            border-right: 1px solid rgba(0, 240, 255, 0.05);
            background: rgba(0,0,0,0.2);
            border-radius: 24px;
            padding: 20px;
        }

        .hologram-stage {
            width: 100%;
            height: 380px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .balanca-projection {
            width: 240px;
            height: 240px;
            position: relative;
            animation: float 4s infinite ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes float {
